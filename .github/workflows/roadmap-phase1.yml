name: Apply Rotwood Gameplay Phase

on:
  push:
    branches:
      - feat/combat-feel-and-run-modifiers

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Apply gameplay changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          def write(path, content):
              Path(path).write_text(textwrap.dedent(content).lstrip(), encoding="utf-8")

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding="utf-8")
              if old not in s:
                  raise SystemExit("Expected text not found in " + path + ": " + old[:120])
              p.write_text(s.replace(old, new, 1), encoding="utf-8")

          write("src/game/runModifiers.ts", r'''
          import type { RandomSource } from "./random";

          export type RunModifierId =
            | "overcharged"
            | "bounty"
            | "demolition"
            | "deadeye"
            | "cryo-ammo"
            | "hot-lead";

          export type RunModifierDefinition = {
            id: RunModifierId;
            name: string;
            description: string;
            effects: {
              rateMultiplier?: number;
              rangeMultiplier?: number;
              damageMultiplier?: number;
              goldMultiplier?: number;
              splashMultiplier?: number;
              slowMultiplier?: number;
            };
          };

          export const RUN_MODIFIER_DEFS: RunModifierDefinition[] = [
            { id: "overcharged", name: "Overcharged", description: "+30% fire rate, −15% range", effects: { rateMultiplier: 1.3, rangeMultiplier: 0.85 } },
            { id: "bounty", name: "Blood Money", description: "+35% gold from kills", effects: { goldMultiplier: 1.35 } },
            { id: "demolition", name: "Demolition", description: "+40% splash radius", effects: { splashMultiplier: 1.4 } },
            { id: "deadeye", name: "Deadeye", description: "+25% damage, −10% fire rate", effects: { damageMultiplier: 1.25, rateMultiplier: 0.9 } },
            { id: "cryo-ammo", name: "Cryo Ammo", description: "Slow effects are 35% stronger", effects: { slowMultiplier: 1.35 } },
            { id: "hot-lead", name: "Hot Lead", description: "+15% damage and +15% gold from kills", effects: { damageMultiplier: 1.15, goldMultiplier: 1.15 } },
          ];

          export type RunModifierEffects = {
            rateMultiplier: number;
            rangeMultiplier: number;
            damageMultiplier: number;
            goldMultiplier: number;
            splashMultiplier: number;
            slowMultiplier: number;
          };

          export function getRunModifierEffects(ids: RunModifierId[]): RunModifierEffects {
            const effects: RunModifierEffects = {
              rateMultiplier: 1,
              rangeMultiplier: 1,
              damageMultiplier: 1,
              goldMultiplier: 1,
              splashMultiplier: 1,
              slowMultiplier: 1,
            };
            for (const id of ids) {
              const definition = RUN_MODIFIER_DEFS.find((entry) => entry.id === id);
              if (!definition) continue;
              const mods = definition.effects;
              if (mods.rateMultiplier) effects.rateMultiplier *= mods.rateMultiplier;
              if (mods.rangeMultiplier) effects.rangeMultiplier *= mods.rangeMultiplier;
              if (mods.damageMultiplier) effects.damageMultiplier *= mods.damageMultiplier;
              if (mods.goldMultiplier) effects.goldMultiplier *= mods.goldMultiplier;
              if (mods.splashMultiplier) effects.splashMultiplier *= mods.splashMultiplier;
              if (mods.slowMultiplier) effects.slowMultiplier *= mods.slowMultiplier;
            }
            return effects;
          }

          export function createRunModifierOffer(random: RandomSource, active: RunModifierId[], count = 3) {
            const available = RUN_MODIFIER_DEFS.filter((entry) => !active.includes(entry.id));
            const pool = [...available];
            const offer: RunModifierDefinition[] = [];
            while (pool.length > 0 && offer.length < Math.min(count, available.length)) {
              const index = Math.min(pool.length - 1, Math.floor(random() * pool.length));
              offer.push(pool.splice(index, 1)[0]!);
            }
            return offer;
          }

          export function shouldOfferRunModifier(wave: number) {
            return wave >= 3 && wave % 3 === 0;
          }
          ''')

          write("src/game/runModifiers.test.ts", r'''
          import { describe, expect, test } from "bun:test";
          import { createRunModifierOffer, getRunModifierEffects, shouldOfferRunModifier } from "./runModifiers";

          describe("run modifiers", () => {
            test("offers every third wave starting at wave 3", () => {
              expect(shouldOfferRunModifier(2)).toBe(false);
              expect(shouldOfferRunModifier(3)).toBe(true);
              expect(shouldOfferRunModifier(6)).toBe(true);
            });

            test("combines active modifiers multiplicatively", () => {
              const effects = getRunModifierEffects(["overcharged", "deadeye"]);
              expect(effects.rateMultiplier).toBeCloseTo(1.17);
              expect(effects.rangeMultiplier).toBeCloseTo(0.85);
              expect(effects.damageMultiplier).toBeCloseTo(1.25);
            });

            test("offers unique choices and excludes active modifiers", () => {
              const offer = createRunModifierOffer(() => 0.25, ["overcharged"]);
              expect(offer).toHaveLength(3);
              expect(new Set(offer.map((entry) => entry.id)).size).toBe(3);
              expect(offer.some((entry) => entry.id === "overcharged")).toBe(false);
            });
          });
          ''')

          write("src/game/combatFeel.ts", r'''
          export type CombatFeedbackInput = {
            killed: boolean;
            crit: boolean;
            exploded: boolean;
            killStreak: number;
          };

          export type CombatFeedback = {
            shake: number;
            hitSound: "hit" | "bigHit" | "death" | "gib";
          };

          export function getCombatFeedback(input: CombatFeedbackInput): CombatFeedback {
            if (input.exploded) return { shake: 0.95, hitSound: "gib" };
            if (input.killed && input.killStreak >= 5) return { shake: 0.7, hitSound: "bigHit" };
            if (input.killed) return { shake: input.crit ? 0.58 : 0.4, hitSound: "death" };
            if (input.crit) return { shake: 0.18, hitSound: "bigHit" };
            return { shake: 0.04, hitSound: "hit" };
          }
          ''')

          write("src/game/combatFeel.test.ts", r'''
          import { describe, expect, test } from "bun:test";
          import { getCombatFeedback } from "./combatFeel";

          describe("combat feedback", () => {
            test("explosions have the strongest shake", () => {
              expect(getCombatFeedback({ killed: true, crit: false, exploded: true, killStreak: 1 })).toEqual({ shake: 0.95, hitSound: "gib" });
            });
            test("kill streaks get stronger feedback", () => {
              expect(getCombatFeedback({ killed: true, crit: false, exploded: false, killStreak: 5 })).toEqual({ shake: 0.7, hitSound: "bigHit" });
            });
            test("ordinary hits remain subtle", () => {
              expect(getCombatFeedback({ killed: false, crit: false, exploded: false, killStreak: 0 })).toEqual({ shake: 0.04, hitSound: "hit" });
            });
          });
          ''')

          write("src/game/analytics.ts", r'''
          export type AnalyticsEventName =
            | "run_started"
            | "run_finished"
            | "tower_built"
            | "tower_upgraded"
            | "modifier_chosen"
            | "daily_mission_claimed";

          export type AnalyticsEvent = {
            name: AnalyticsEventName;
            at: string;
            payload?: Record<string, string | number | boolean>;
          };

          const KEY = "rotwood.analytics.v1";
          const MAX_EVENTS = 500;

          function read(): AnalyticsEvent[] {
            if (typeof localStorage === "undefined") return [];
            try {
              const raw = localStorage.getItem(KEY);
              const value = raw ? JSON.parse(raw) : [];
              return Array.isArray(value) ? value.slice(-MAX_EVENTS) : [];
            } catch {
              return [];
            }
          }

          let events = read();

          export function track(name: AnalyticsEventName, payload?: Record<string, string | number | boolean>) {
            events = [...events, { name, at: new Date().toISOString(), payload }].slice(-MAX_EVENTS);
            try {
              localStorage.setItem(KEY, JSON.stringify(events));
            } catch {
              /* analytics remain in memory */
            }
          }

          export function getAnalyticsSnapshot() {
            return [...events];
          }

          export function clearAnalytics() {
            events = [];
            try { localStorage.removeItem(KEY); } catch { /* ignore */ }
          }
          ''')

          write("src/game/analytics.test.ts", r'''
          import { describe, expect, test } from "bun:test";
          import { clearAnalytics, getAnalyticsSnapshot, track } from "./analytics";

          describe("analytics", () => {
            test("records and reads gameplay events", () => {
              clearAnalytics();
              track("run_started", { stageId: 1 });
              expect(getAnalyticsSnapshot().at(-1)).toMatchObject({ name: "run_started", payload: { stageId: 1 } });
            });
          });
          ''')

          replace_once("src/game/engine.ts", 'import { getWaveSpawnPlan } from "./waves";',
            'import { getWaveSpawnPlan } from "./waves";\nimport { getCombatFeedback } from "./combatFeel";\nimport { createRunModifierOffer, getRunModifierEffects, shouldOfferRunModifier, type RunModifierDefinition, type RunModifierId } from "./runModifiers";\nimport { track } from "./analytics";')

          replace_once("src/game/engine.ts", '  waveMessageType: "start" | "complete" | "boss" | "";',
            '  waveMessageType: "start" | "complete" | "boss" | "";\n  runModifierOffer: RunModifierDefinition[];\n  activeRunModifiers: RunModifierId[];\n  killStreak: number;\n  killStreakTimer: number;\n  screenShake: number;')

          replace_once("src/game/engine.ts", '    waveMessageType: "",\n    towers: [],',
            '    waveMessageType: "",\n    runModifierOffer: [],\n    activeRunModifiers: [],\n    killStreak: 0,\n    killStreakTimer: 0,\n    screenShake: 0,\n    towers: [],')

          replace_once("src/game/engine.ts", '''  startStage(stage: StageRunConfig) {
  this.stage = stage;
  this.nextId = 1;
  this.state = makeState(stage);
  this.emit();
}''',
            '''  startStage(stage: StageRunConfig) {
              this.stage = stage;
              this.nextId = 1;
              this.state = makeState(stage);
              this.emit();
            }

            chooseRunModifier(id: RunModifierId): boolean {
              const s = this.state;
              const chosen = s.runModifierOffer.find((entry) => entry.id === id);
              if (!chosen) return false;
              s.activeRunModifiers = [...s.activeRunModifiers, id];
              s.runModifierOffer = [];
              s.waveMessage = chosen.name.toUpperCase() + " ACTIVE";
              s.waveMessageLife = 1.4;
              s.waveMessageType = "complete";
              track("modifier_chosen", { modifier: id, wave: s.wave });
              const plan = getWaveSpawnPlan(s.wave, s.stageWaveTarget);
              const queueMult =
                Math.max(0.8, this.stage.gameplay.waveSizeMultiplier) *
                Math.max(0.8, this.stage.gameplay.waveDifficultyMultiplier);
              const bossWave = this.stage.boss.enabled && this.stage.boss.wave === s.wave;
              const bossCount = bossWave ? Math.max(0, this.stage.boss.count) : 0;
              const queue = Math.floor((4 + s.wave * 1.5) * queueMult * plan.sizeMultiplier) + bossCount;
              s.spawnQueue = Math.min(64, Math.max(1, queue));
              s.spawnTimer = 0;
              s.waveTimer = plan.clearDelay * Math.max(0.55, this.stage.gameplay.waveDelayMultiplier);
              sfx("upgrade");
              this.emit();
              return true;
            }''')

          replace_once("src/game/engine.ts", '    if (s.waveMessageLife > 0) {',
            '    if (s.runModifierOffer.length > 0) return;\n    if (s.killStreakTimer > 0) {\n      s.killStreakTimer = Math.max(0, s.killStreakTimer - dt);\n      if (s.killStreakTimer === 0) s.killStreak = 0;\n    }\n    s.screenShake = Math.max(0, s.screenShake - dt * 6);\n    if (s.waveMessageLife > 0) {')

          replace_once("src/game/engine.ts", '    const bossCount = bossWave ? Math.max(0, this.stage.boss.count) : 0;',
            '''    if (shouldOfferRunModifier(s.wave)) {
              s.runModifierOffer = createRunModifierOffer(this.random, s.activeRunModifiers);
              if (s.runModifierOffer.length > 0) {
                s.waveMessage = "CHOOSE YOUR POWER";
                s.waveMessageLife = 999;
                s.waveMessageType = "complete";
                profile.recordWaveReached(s.wave);
                sfx("wave");
                this.emit();
                return;
              }
            }

            const bossCount = bossWave ? Math.max(0, this.stage.boss.count) : 0;''')

          replace_once("src/game/engine.ts", '''    if (!result.killed) {
      z.flash = 1;
      if (dmg >= 0.5) sfx("hit");
      return;
    }''',
            '''    if (!result.killed) {
              z.flash = 1;
              const feedback = getCombatFeedback({
                killed: false,
                crit: result.crit,
                exploded: false,
                killStreak: s.killStreak,
              });
              s.screenShake = Math.min(1.5, s.screenShake + feedback.shake);
              if (dmg >= 0.5) sfx(feedback.hitSound);
              return;
            }''')

          replace_once("src/game/engine.ts", '''    z.dead = true;
    z.fade = 0;
    s.kills += 1;
    s.gold += result.killGold;''',
            '''    z.dead = true;
            z.fade = 0;
            s.kills += 1;
            s.killStreak = s.killStreakTimer > 0 ? s.killStreak + 1 : 1;
            s.killStreakTimer = 2.25;
            const goldMultiplier = getRunModifierEffects(s.activeRunModifiers).goldMultiplier;
            s.gold += Math.round(result.killGold * goldMultiplier);
            const feedback = getCombatFeedback({
              killed: true,
              crit: result.crit,
              exploded: result.explode,
              killStreak: s.killStreak,
            });
            s.screenShake = Math.min(1.8, s.screenShake + feedback.shake);''')

          replace_once("src/game/engine.ts", '      sfx("gib");\n    } else {\n      this.spawnGibs(z, 3, 0.8);\n      sfx("death");\n    }',
            '      sfx("gib");\n    } else {\n      this.spawnGibs(z, 3, 0.8);\n      sfx(feedback.hitSound);\n    }')

          replace_once("src/game/engine.ts", '    // towers\n    for (const t of s.towers) {',
            '    // towers\n    const runEffects = getRunModifierEffects(s.activeRunModifiers);\n    for (const t of s.towers) {')
          replace_once("src/game/engine.ts", '      const best = selectTowerTarget(s.zombies, t, towerRange(t), t.targetMode);',
            '      const best = selectTowerTarget(s.zombies, t, towerRange(t) * runEffects.rangeMultiplier, t.targetMode);')
          replace_once("src/game/engine.ts", '          const rate = towerRate(t);',
            '          const rate = towerRate(t) * runEffects.rateMultiplier;')
          replace_once("src/game/engine.ts", '              damage: towerDamage(t) * (crit ? 2.5 : 1),',
            '              damage: towerDamage(t) * runEffects.damageMultiplier * (crit ? 2.5 : 1),')
          replace_once("src/game/engine.ts", '              splash: towerSplash(t),',
            '              splash: towerSplash(t) * runEffects.splashMultiplier,')
          replace_once("src/game/engine.ts", '              slow: towerSlow(t),',
            '              slow: towerSlow(t) * runEffects.slowMultiplier,')
          replace_once("src/game/engine.ts", '              gold: towerGold(t),',
            '              gold: towerGold(t) * runEffects.goldMultiplier,')
          replace_once("src/game/engine.ts", '    profile.recordTowerBuilt(kind);\n    sfx("build");',
            '    profile.recordTowerBuilt(kind);\n    track("tower_built", { kind });\n    sfx("build");')
          replace_once("src/game/engine.ts", '    profile.recordTowerUpgrade(t.kind);\n    sfx("upgrade");',
            '    profile.recordTowerUpgrade(t.kind);\n    track("tower_upgraded", { kind: t.kind, level: t.level });\n    sfx("upgrade");')

          replace_once("src/game/audio.ts", '  | "gameOver";',
            '  | "gameOver"\n  | "bigHit";')
          replace_once("src/game/audio.ts",
            '    case "gameOver":\n      tone({ freq: 400, to: 80, dur: 0.9, type: "sawtooth", gain: 0.18 });\n      return;',
            '    case "gameOver":\n      tone({ freq: 400, to: 80, dur: 0.9, type: "sawtooth", gain: 0.18 });\n      return;\n    case "bigHit":\n      tone({ freq: 920, to: 240, dur: 0.11, type: "triangle", gain: 0.1 });\n      return;')

          replace_once("src/components/game/Scene.tsx", 'function CameraRig() {\n  const { camera, size } = useThree();',
            '''function CameraRig() {
              const { camera, size } = useThree();
              const basePosition = useRef(new THREE.Vector3());
              const baseTarget = useRef(new THREE.Vector3());''')
          replace_once("src/components/game/Scene.tsx",
            '    cam.position.set(0, portrait ? 38 : 34, portrait ? 15 : 26);\n    cam.lookAt(0, 0, portrait ? -3 : -2);\n    cam.updateProjectionMatrix();',
            '''    cam.position.set(0, portrait ? 38 : 34, portrait ? 15 : 26);
              basePosition.current.copy(cam.position);
              baseTarget.current.set(0, 0, portrait ? -3 : -2);
              cam.lookAt(baseTarget.current);
              cam.updateProjectionMatrix();''')
          replace_once("src/components/game/Scene.tsx",
            '  }, [camera, size.width, size.height]);\n  return null;',
            '''  }, [camera, size.width, size.height]);

            useFrame(({ clock }) => {
              const shake = Math.min(1, game.state.screenShake);
              if (shake <= 0.001) {
                camera.position.lerp(basePosition.current, 0.35);
                camera.lookAt(baseTarget.current);
                return;
              }
              const t = clock.elapsedTime * 54;
              const amplitude = shake * 0.28;
              camera.position.copy(basePosition.current);
              camera.position.x += Math.sin(t * 1.7) * amplitude;
              camera.position.y += Math.cos(t * 1.3) * amplitude * 0.7;
              camera.position.z += Math.sin(t * 2.1) * amplitude * 0.5;
              camera.lookAt(baseTarget.current);
            });
            return null;''')
          replace_once("src/components/game/Scene.tsx",
            '    object.scale.setScalar(popup.crit ? 1.35 : 1);',
            '    object.scale.setScalar(popup.gold > 0 ? 1.55 : popup.crit ? 1.35 : 1);')
          replace_once("src/components/game/Scene.tsx",
            '      color="#ffffff"\n      outlineColor="#111111"',
            '      color={popup.gold > 0 ? "#ffd86b" : popup.crit ? "#fff3c4" : "#ffffff"}\n      outlineColor="#111111"')

          replace_once("src/components/game/HUD.tsx",
            'import type { Selection } from "./Scene";',
            'import type { Selection } from "./Scene";\nimport { track } from "@/game/analytics";')
          replace_once("src/components/game/HUD.tsx",
            '  return (\n    <div className="pointer-events-none absolute inset-0 z-20 flex flex-col justify-between p-2 pt-[max(0.5rem,env(safe-area-inset-top))]">',
            '''  return (
    <div className="pointer-events-none absolute inset-0 z-20 flex flex-col justify-between p-2 pt-[max(0.5rem,env(safe-area-inset-top))]">
      {state.runModifierOffer.length > 0 && (
        <div className="pointer-events-auto absolute inset-0 flex items-center justify-center bg-black/65 p-3 backdrop-blur-sm">
          <div className="w-full max-w-md rounded-3xl border border-accent/40 bg-panel/95 p-4 shadow-panel">
            <p className="text-center text-[10px] uppercase tracking-[0.24em] text-accent">Wave power</p>
            <h2 className="mt-1 text-center font-display text-3xl tracking-wide text-panel-foreground">Choose Your Power</h2>
            <p className="mt-1 text-center text-xs text-panel-muted">Pick one effect for the rest of this run.</p>
            <div className="mt-4 space-y-2">
              {state.runModifierOffer.map((modifier) => (
                <button
                  key={modifier.id}
                  type="button"
                  onClick={() => {
                    if (game.chooseRunModifier(modifier.id)) {
                      track("modifier_chosen", { modifier: modifier.id, wave: state.wave });
                    }
                  }}
                  className="w-full rounded-2xl border border-white/10 bg-black/25 p-3 text-left transition active:scale-[0.98] hover:border-accent/50"
                >
                  <p className="font-display text-lg tracking-wide text-panel-foreground">{modifier.name}</p>
                  <p className="mt-0.5 text-xs text-panel-muted">{modifier.description}</p>
                </button>
              ))}
            </div>
          </div>
        </div>
      )}''')

          Path(".github/workflows/roadmap-phase1.yml").unlink(missing_ok=True)
          PY

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate
        run: |
          bun run lint
          bun run test:unit
          bun run build
          bun run test:e2e

      - name: Commit validated changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game src/components/game/Scene.tsx src/components/game/HUD.tsx .github/workflows/roadmap-phase1.yml
          git commit -m "feat: add combat feel and run modifiers [skip ci]"
          git push origin HEAD
